# plugin-manager 聚合包：挂载 host 插件管理网关与浏览器 UI 两行。
# 两个子包作为本包的依赖，由 `dsh plugin add file:<本目录>` 经 pnpm 拷入目标
# profile 的 node_modules，loader 从该层按包名解析。
- insert:
    - id: plugin-manager
      name: '@deepseek-ai/dsh-host-plugin-manager'
    - id: ui-plugin-manager
      name: '@deepseek-ai/dsh-client-ui-plugin-manager'
